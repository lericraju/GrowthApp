<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" rx="128" fill="url(#bg)" stroke="url(#grad)" stroke-width="12" />
  
  <!-- Stylized V-Taper / Ironman Icon -->
  <g transform="translate(128, 128) scale(0.5)">
    <!-- Shield / Triangle V-Taper Base -->
    <path d="M256 64 L448 384 L64 384 Z" fill="none" stroke="url(#grad)" stroke-width="24" stroke-linejoin="round" opacity="0.3" />
    
    <!-- Heartbeat / Pace Trail -->
    <path d="M64 256 L160 256 L200 128 L256 384 L312 220 L352 256 L448 256" fill="none" stroke="url(#grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dumbbell ends -->
    <circle cx="64" cy="256" r="28" fill="#38bdf8" />
    <circle cx="448" cy="256" r="28" fill="#c084fc" />
  </g>
</svg>
